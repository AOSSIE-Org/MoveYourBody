name: move_your_body
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_riverpod: ^3.3.1
  go_router: ^17.3.0
  freezed_annotation: ^3.1.0
  riverpod_annotation: ^4.0.2
  flutter_onnxruntime: ^1.8.0
  dart_wordpiece: ^1.2.0
  sqflite: ^2.4.3
  path: ^1.9.1
  lottie: ^3.3.1
  video_player: ^2.9.6
  flutter_cache_manager: ^3.4.1
  shared_preferences: ^2.5.3
  package_info_plus: ^8.3.0
  chewie: ^1.10.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.0
  freezed: ^3.2.5
  riverpod_generator: ^4.0.3
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/move_your_body_logo.png"

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/images/
    - assets/models/vocab.txt
    - assets/models/model_quantized.onnx
    - assets/exercises/
    - assets/exercises.db
    - assets/animations/
    - public/
