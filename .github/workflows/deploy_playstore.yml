name: Deploy to Play Store & GitHub Release

on:
  push:
    branches:
      - main
      - ci/setup-playstore-deploy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_deploy:
    name: Build, Release & Deploy
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: '17'
      PYTHON_VERSION: '3.10'
      KEYSTORE_PATH: android/app/upload-keystore.jks
      KEY_PROPS_PATH: android/key.properties
      SERVICE_ACCOUNT_PATH: service_account.json
      AAB_PATH: build/app/outputs/bundle/release/app-release.aab
      APK_PATH: build/app/outputs/flutter-apk/app-release.apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy onnxruntime transformers

      - name: Generate SQLite Database
        run: python scripts/generate_exercise_db.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Decode Android Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > ${{ env.KEYSTORE_PATH }}

      - name: Decode Android Key Properties
        run: echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" | base64 --decode > ${{ env.KEY_PROPS_PATH }}

      - name: Decode Google Play Service Account
        id: check_service_account
        run: |
          if [ -n "${{ secrets.ANDROID_RELEASE_SERVICE_ACCOUNT }}" ]; then
            echo "${{ secrets.ANDROID_RELEASE_SERVICE_ACCOUNT }}" | base64 --decode > ${{ env.SERVICE_ACCOUNT_PATH }}
            echo "has_service_account=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::ANDROID_RELEASE_SERVICE_ACCOUNT secret is not configured. Skipping Play Store upload."
            echo "has_service_account=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Build Artifacts (CI Storage)
        uses: actions/upload-artifact@v4
        with:
          name: release-builds
          path: |
            ${{ env.AAB_PATH }}
            ${{ env.APK_PATH }}

      - name: Deploy to Play Store (Internal Testing)
        if: steps.check_service_account.outputs.has_service_account == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ env.SERVICE_ACCOUNT_PATH }}
          packageName: org.aossie.move
          releaseFiles: ${{ env.AAB_PATH }}
          track: internal

      - name: Read Version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //g' | tr -d '[:space:]')
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: v$VERSION"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: "Release ${{ steps.get_version.outputs.version }}"
          generate_release_notes: true
          files: |
            ${{ env.AAB_PATH }}
            ${{ env.APK_PATH }}
