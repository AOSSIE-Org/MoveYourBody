name: Generate Exercises Database

on:
  push:
    paths:
      - "assets/exercises/exercises.json"
      - "scripts/generate_exercise_db.py"
      - "lib/core/database/tables/exercise_table.dart"
      - "lib/core/database/tables/tags_table.dart"
      - "lib/core/database/schema/exercise_schema.dart"
      - "lib/core/database/schema/tags_schema.dart"

  workflow_dispatch:

jobs:
  generate-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install onnxruntime transformers numpy

      - name: Generate exercises database
        run: |
          python scripts/generate_exercise_db.py

      - name: Verify generated database
        run: |
          test -f assets/exercises.db
          test -s assets/exercises.db
          echo " exercises.db generated successfully."

      - name: Upload generated database
        uses: actions/upload-artifact@v4
        with:
          name: exercises-db
          path: assets/exercises.db
          if-no-files-found: error
